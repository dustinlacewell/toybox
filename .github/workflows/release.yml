name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (aarch64)
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
            bundle-target: aarch64-apple-darwin
          - platform: macos-15-intel # Intel (x86_64)
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
            bundle-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tbx ships inside every installer (Tauri's externalBin, only in the release config): build it for this
      # target first and put it where Tauri looks for it. Plain `tauri dev` / `tauri build` do not need this.
      - name: Build the tbx that goes into the installers
        run: node scripts/prepare-tbx-sidecar.mjs --target ${{ matrix.rust-target }}

      - name: Validate release version, signing configuration and the tbx sidecar
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RUST_TARGET: ${{ matrix.rust-target }}
          REQUIRE_TBX: "1"
        run: node scripts/check-release.mjs

      - name: Build and release Toybox
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Toybox ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install Toybox."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

      - name: Check that tbx is in what was built
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          BUNDLE_TARGET: ${{ matrix.bundle-target }}
        run: node scripts/check-release.mjs --bundle

  # The programs that are not installers: toybox-server (Linux x86_64 and ARM64) and tbx (every platform), each
  # signed with the key that signs the app's updates and attached to the same draft release. They wait for the
  # app job because that is what creates the draft. The manifest comes after them, in the job below.
  standalone:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # the oldest runner we use: the binaries run on newer glibc too
            rust-target: x86_64-unknown-linux-gnu
            only: all
          - platform: ubuntu-22.04-arm # Linux on ARM64 (a Raspberry Pi, an ARM home server): no app, but both programs
            rust-target: aarch64-unknown-linux-gnu
            only: all
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            only: tbx
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            only: tbx
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            only: tbx

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: standalone-${{ matrix.rust-target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version and signing configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/check-release.mjs

      # tbx embeds the plugin SDK; the script builds it when it is missing.
      - name: Build, sign and describe the programs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-server-release.mjs --target ${{ matrix.rust-target }} --only ${{ matrix.only }} --out release-assets --notes "Toybox ${{ github.ref_name }}"

      # Not the manifest this wrote: it only knows this job's server. The job below writes the one for all of them.
      - name: Attach them to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            release-assets/toybox-server-*
            release-assets/tbx-*

  # The manifest `toybox-server update` reads lists every toybox-server of the release, so it is written once
  # all of them are attached: download them, check each signature again, describe them.
  manifest:
    needs: standalone
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the servers of this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --pattern "toybox-server-*" --dir release-assets

      - name: Write the manifest and check it lists both Linux servers
        run: |
          node scripts/build-server-release.mjs --manifest-only --out release-assets --notes "Toybox ${{ github.ref_name }}"
          node -e "const t=Object.keys(require('./release-assets/toybox-server.json').targets);for(const w of ['x86_64-unknown-linux-gnu','aarch64-unknown-linux-gnu'])if(!t.includes(w)){console.error('error: the release has no toybox-server for '+w);process.exit(1)}"

      - name: Attach it to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release-assets/toybox-server.json
