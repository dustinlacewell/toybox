[package]
name = "toybox-host"
version.workspace = true
description = "What the Toybox app and the tbx command line both do around libraries: the registered libraries, plugins, settings, and routing a request to a local or remote library (no GUI dependency)"
authors = ["Dustin Lacewell"]
edition = "2021"

[lib]
name = "toybox_host"

[dependencies]
toybox-core = { path = "../toybox-core" }
toybox-remote = { path = "../toybox-remote" }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
image = { workspace = true }
dirs = "7"
rusqlite = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
